items:
  - question: Why don't you list prices?
    answer: >-
      No two events are alike. Guest count, hours of service, location and menu all
      change what makes sense for you. Fill out the quote form and we'll put together
      a personalized quote for your event.
  - question: What's on the menu? Can we customize it?
    answer: >-
      Our core menu covers espresso classics like lattes, cappuccinos, cortados and
      Americanos, plus matcha and hot chocolate. We also rotate house-made syrups
      each season. Want a signature drink for your event? Just ask.
  - question: Do you offer milk alternatives?
    answer: Yes! We carry whole, oat and almond milk.
  - question: Do you have non-coffee options?
    answer: >-
      Absolutely. Matcha lattes and hot chocolate are always on the menu, and
      seasonal syrups work great in steamers too.
  - question: How much space and power does the cart need?
    answer: >-
      We'll confirm the details with you, but plan for a flat area about the size of
      a parking space and access to a standard power outlet.
  - question: How far in advance should we book?
    answer: >-
      The sooner the better, especially for weekends and wedding season. Reach out
      as soon as you have a date and we'll let you know if we're available.
  - question: Can guests pay for their own drinks?
    answer: >-
      Yes. We can host an open bar paid for by you, let guests pay for themselves, or
      do a mix of both. We'll talk through what fits your event when we send your quote.
